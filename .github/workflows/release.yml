name: Release

# Fires on every push to main (i.e. every merge from a feature branch). Builds the frontend,
# packages it into the Spring Boot jar the same way build.bat does locally, bumps the patch
# version automatically from the latest vX.Y.Z tag, and publishes a GitHub release with the
# same run.bat/build.bat/README.md + jar zip layout as the manual releases.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (frontend -> backend static -> jar)
        shell: cmd
        run: build.bat

      - name: Compute next version
        id: version
        shell: bash
        run: |
          git fetch --tags --quiet
          tags=$(git tag -l 'v*.*.*')
          if [ -z "$tags" ]; then
            latest="v0.0.0"
          else
            latest="v$(echo "$tags" | sed 's/^v//' | sort -V | tail -1)"
          fi
          version=${latest#v}
          IFS='.' read -r major minor patch <<< "$version"
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (previous: $latest)"

      - name: Package release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $stage = "stage/devtools-suite"
          New-Item -ItemType Directory -Force -Path "$stage/backend/target" | Out-Null
          Copy-Item build.bat,run.bat,README.md -Destination $stage
          Copy-Item backend/target/devtools-suite.jar -Destination "$stage/backend/target/devtools-suite.jar"
          Compress-Archive -Path $stage -DestinationPath "devtools-suite-$tag.zip"

      - name: Create release
        # Deliberately NOT `git tag` + `git push` — the default GITHUB_TOKEN can't push any ref
        # (branch or tag) on a commit whose tree touches .github/workflows/**, even just to
        # retag an already-pushed commit ("refusing to allow a GitHub App to create or update
        # workflow ... without workflows permission"). `gh release create` creates the tag via
        # the REST API instead of a git push, which isn't subject to that restriction.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "devtools-suite-${{ steps.version.outputs.tag }}.zip" \
            --title "Dev Tools Suite ${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --generate-notes
