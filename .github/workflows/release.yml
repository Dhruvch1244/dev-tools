name: Release

# Fires on every push to main (i.e. every merge from a feature branch). Builds the frontend,
# packages it into the Spring Boot jar the same way build.bat does locally, bumps the patch
# version automatically from the latest vX.Y.Z tag, and publishes a GitHub release with the
# same run.bat/build.bat/README.md + jar zip layout as the manual releases.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (frontend -> backend static -> jar)
        shell: cmd
        run: build.bat

      - name: Compute next version
        id: version
        shell: bash
        run: |
          git fetch --tags --quiet
          latest=$(git tag -l 'v*.*.*' | sort -t. -k1.2,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$latest" ]; then latest="v0.0.0"; fi
          version=${latest#v}
          IFS='.' read -r major minor patch <<< "$version"
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (previous: $latest)"

      - name: Package release zip
        shell: bash
        run: |
          stage="stage/devtools-suite"
          mkdir -p "$stage/backend/target"
          cp build.bat run.bat README.md "$stage/"
          cp backend/target/devtools-suite.jar "$stage/backend/target/devtools-suite.jar"
          (cd stage && 7z a -tzip "../devtools-suite-${{ steps.version.outputs.tag }}.zip" devtools-suite)

      - name: Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Dev Tools Suite ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "devtools-suite-${{ steps.version.outputs.tag }}.zip" \
            --title "Dev Tools Suite ${{ steps.version.outputs.tag }}" \
            --generate-notes
